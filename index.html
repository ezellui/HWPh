<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HWPh</title>
<script src="i18n.js"></script>
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<style>
:root{
  --paper:#F2F3EF; --paper-2:#E7E9E3; --ink:#1D2320; --ink-2:#56605A; --rule:#CDD2CA;
  --cloth:#2E5A43; --cloth-ink:#F2F3EF; --brass:#8A6A22; --mark:#E6E09A; --mark-cur:#D4C24E;
  --link:#245A70; --dead:#8B8F88;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Cambria","Times New Roman",serif;
  --sans:"Segoe UI",Tahoma,"Helvetica Neue",Arial,sans-serif;
  --fs:19px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B201D; --paper-2:#232A26; --ink:#DADFD6; --ink-2:#9AA59C; --rule:#35403A;
    --cloth:#2F5E47; --cloth-ink:#E9EEE6; --brass:#C9A95A; --mark:#5C5A26; --mark-cur:#8C8327;
    --link:#8CC0D6; --dead:#77807A;
  }
}
:root[data-theme="dark"]{
  --paper:#1B201D; --paper-2:#232A26; --ink:#DADFD6; --ink-2:#9AA59C; --rule:#35403A;
  --cloth:#2F5E47; --cloth-ink:#E9EEE6; --brass:#C9A95A; --mark:#5C5A26; --mark-cur:#8C8327;
  --link:#8CC0D6; --dead:#77807A;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;display:flex;flex-direction:column}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button,select,input{font:inherit;color:inherit}

/* top bar: the cloth spine */
#bar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--cloth);color:var(--cloth-ink)}
#bar .brand{font-family:var(--serif);font-size:22px;letter-spacing:.02em;color:var(--cloth-ink);white-space:nowrap}
#bar .brand small{font-size:13px;opacity:.75;margin-left:6px}
#qwrap{position:relative;flex:1;min-width:120px;max-width:680px;display:flex}
#sugg{display:none;position:absolute;left:0;right:0;top:100%;margin-top:3px;z-index:30;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-top:3px solid var(--cloth);box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:70vh;overflow:auto}
#sugg .it{display:flex;gap:10px;align-items:baseline;padding:5px 10px;cursor:pointer;border-bottom:1px solid var(--paper-2)}
#sugg .it.on,#sugg .it:hover{background:var(--paper-2)}
#sugg .it .k{flex:none;width:74px;font-size:11.5px;color:var(--ink-2)}
#sugg .it .l{font-family:var(--serif);font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sugg .it .s{font-size:12px;color:var(--ink-2);white-space:nowrap}
#sugg .it.full .l{font-family:var(--sans);font-size:14px}
#q{flex:1;min-width:0;width:100%;padding:7px 10px;border:1px solid transparent;border-radius:3px;background:var(--paper);color:var(--ink)}
#bar select{padding:6px;border-radius:3px;border:0;background:var(--paper);color:var(--ink)}
#bar button{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--cloth-ink);border-radius:3px;padding:5px 9px;cursor:pointer}
#bar button:hover{background:rgba(255,255,255,.12)}
#menu{display:none}

#main{flex:1;display:flex;min-height:0}
/* index of lemmas */
#index{width:290px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--rule);background:var(--paper-2)}
#index input{margin:10px;padding:6px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--paper)}
#index .count{padding:0 12px 6px;color:var(--ink-2);font-size:12.5px}
#list{flex:1;overflow:auto;padding-bottom:20px}
#list a{display:flex;justify-content:space-between;gap:8px;padding:3px 12px;color:var(--ink);font-family:var(--serif);font-size:15.5px;line-height:1.3}
#list a span{color:var(--ink-2);font-family:var(--sans);font-size:11.5px;white-space:nowrap;padding-top:3px}
#list a:hover{background:var(--paper);text-decoration:none}
#list a.front{font-style:italic;color:var(--ink-2)}
#list a.cur{background:var(--paper);box-shadow:inset 3px 0 0 var(--cloth)}
#list .letter{font-family:var(--serif);font-size:20px;color:var(--brass);padding:10px 12px 2px}

#view{flex:1;overflow:auto;scroll-behavior:auto}
.page{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:40px;max-width:1120px;margin:0 auto;padding:28px 32px 80px}
.page.wide{grid-template-columns:minmax(0,1fr)}

/* article */
.text{max-width:40em;font-family:var(--textfont, var(--serif));font-size:var(--fs);line-height:1.62;hyphens:auto;-webkit-hyphens:auto}
.head{position:relative;margin:4px 0 26px;padding-left:18px;border-left:3px solid var(--brass)}
.head h1{font-family:var(--serif);font-weight:normal;font-size:2.1em;line-height:1.12;margin:0 0 10px;letter-spacing:-.005em}
.head .cols{font-family:var(--sans);font-size:13px;color:var(--ink-2);line-height:1.6}
.head .cols b{font-weight:600;color:var(--ink)}
.text p{margin:0 0 .75em;text-align:left}
.text p[id]{margin-top:1.1em}
.text p.lit{font-size:.84em;line-height:1.5;color:var(--ink-2);margin-bottom:.45em}
.text h3{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink-2);margin:2em 0 .6em;padding-top:.6em;border-top:1px solid var(--rule)}
.text sup.fn{font-family:var(--sans);font-size:.6em;color:var(--link);cursor:pointer;padding:0 1px;vertical-align:.55em;line-height:0}
.text sup.fn:hover{text-decoration:underline}
.text ol.notes{font-size:.8em;line-height:1.5;padding-left:2.6em;color:var(--ink)}
.text ol.notes li{margin:0 0 .35em}
.text ol.notes li:target, .text ol.notes li.flash{background:var(--mark)}
.text .xref{border-bottom:1px solid var(--rule)}
.text .xref:hover{text-decoration:none;border-bottom-color:var(--link)}
.text .xref-dead{color:var(--dead)}
.text .sd{font-family:var(--sans);font-size:.72em;color:var(--ink-2)}
.ovl{position:relative;display:inline-block}
.ovl::before{content:'e';position:absolute;left:50%;transform:translateX(-50%);top:-.62em;font-size:.62em;line-height:1}
.text .ocr{font-family:var(--sans);font-size:12px;color:var(--ink-2);border-left:2px solid var(--brass);padding:2px 8px;margin:1em 0 .4em}
.text .gap{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);border:1px dashed var(--rule);padding:6px 10px;margin:1em 0}
.text .md{margin:.9em 0;overflow-x:auto;text-align:center}
.text .m,.text .md{font-family:inherit}
.text .tbl{overflow-x:auto;margin:.9em 0}
.text .tbl table{border-collapse:collapse;font-family:var(--serif);font-size:.92em;margin:0 auto}
.text .tbl th,.text .tbl td{border:1px solid var(--rule);padding:3px 12px;text-align:center}
.text .tbl th{background:var(--paper-2);font-weight:normal}
.text img.pic{height:1.05em;vertical-align:-.18em}
.text figure.pic{margin:1em 0;text-align:center}
.text figure.pic img{max-width:100%;background:#fff;padding:6px;border-radius:2px}
.text svg.pic{height:1.05em;width:auto;vertical-align:-.18em;overflow:visible}
.text .col{display:inline}
body.showcols .text .col::before,.text .col.target::before{content:"Sp. " attr(data-col);font-family:var(--sans);font-size:11px;font-weight:600;color:var(--brass);border-left:2px solid var(--brass);padding:0 3px 0 4px;margin:0 3px;white-space:nowrap;vertical-align:1px}
.text .col.target::before{background:var(--mark);color:var(--ink)}
/* the columns of the printed edition as a layout: odd columns on the left, one row per printed page */
body.bookmode .text{max-width:none}
.bookcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:30px;margin:0 0 .5em}
.bookcols .bcol{min-width:0;padding:0 0 14px;margin:0 0 14px;border-bottom:1px dashed var(--rule)}
.bookcols .bcol.l{position:relative}
.bookcols .bcol.l::after{content:"";position:absolute;top:0;bottom:14px;right:-15px;border-right:1px solid var(--rule)}
.bookcols .bc-h{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--brass);margin:0 0 .5em;cursor:help;display:inline-block;border-bottom:1px dotted var(--brass)}
.bookcols .bc-h::before{content:"Sp. " attr(data-col) " ≈"}
.bookcols .bcol.flash .bc-h{background:var(--mark);color:var(--ink)}
.bookcols .bcol > div > p:first-child, .bookcols .bcol > div > h3:first-child{margin-top:0;padding-top:0;border-top:0}
.text .cut{margin-bottom:0}
.text p.cont{margin-top:0}
.text ol.notes li.cont{list-style:none}
.bookcols ol.notes{margin:0;padding-left:2.4em}
.bookcols .tbl table{font-size:.84em}
.bookcols .tbl th,.bookcols .tbl td{padding:2px 7px}
/* a page whose table, formula or picture does not fit a column: both its columns run the full width */
.bookcols .bcol.wide{grid-column:1 / -1}
.bookcols .bcol.wide::after{display:none}
.bookcols div.bcol.wide{display:none}
@media (max-width:760px){ .bookcols{grid-template-columns:minmax(0,1fr)} .bookcols .bcol.l::after{display:none} }
#jump{display:flex;gap:4px;margin:0 10px 6px;align-items:center}
#jump select,#jump input{padding:4px 5px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);font-size:13px;min-width:0}
#jump input{width:0;flex:1}
#jump button{border:1px solid var(--rule);background:var(--paper);border-radius:3px;padding:3px 9px;cursor:pointer}
#jump .msg{font-size:12px;color:#A23B2A}
.text figure.pic.vec svg{display:block;width:100%;height:auto;margin:0 auto}
:root[data-theme="dark"] .text img.pic{filter:invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .text img.pic{filter:invert(1)}}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
mark.cur{background:var(--mark-cur)}

/* the margin rail */
.rail{font-size:13.5px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:28px 0 40px}
.rail h4{font-size:12.5px;font-weight:600;color:var(--ink-2);margin:18px 0 6px}
.rail h4:first-child{margin-top:0}
.rail ul{list-style:none;margin:0;padding:0}
.rail li{margin:2px 0;line-height:1.35}
.rail .toc a{color:var(--ink)}
.rail .toc li.l2{padding-left:12px}
.rail .toc li.l3{padding-left:24px;color:var(--ink-2)}
.rail .toc li.l3 a{color:var(--ink-2)}
.rail .n{color:var(--ink-2);font-size:12px}
.rail .reg{column-count:1}
.rail .reg li{font-family:var(--serif);font-size:14.5px}
.rail .more{background:none;border:0;padding:2px 0;color:var(--link);cursor:pointer}
.hitnav{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;background:var(--paper);border-bottom:1px solid var(--rule);padding:6px 0;margin:-10px 0 16px;font-family:var(--sans);font-size:13px;color:var(--ink-2)}
.hitnav button{border:1px solid var(--rule);background:var(--paper-2);border-radius:3px;padding:2px 9px;cursor:pointer}
.pager{display:flex;justify-content:space-between;gap:20px;margin-top:48px;padding-top:14px;border-top:1px solid var(--rule);font-family:var(--serif);font-size:16px}
.pager small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-2)}
.pager .nx{text-align:right}

/* results */
.results{max-width:52em}
.results h2{font-family:var(--serif);font-weight:normal;font-size:26px;margin:4px 0 4px}
.glist2{columns:2 280px;column-gap:40px;list-style:none;padding:0;margin:0}
.glist2 li{break-inside:avoid;padding:3px 0;font-family:var(--serif);font-size:16px}
.glist2 li .n{font-family:var(--sans);font-size:12px;color:var(--ink-2)}
.glist2 li.un{color:var(--ink-2)}
.glist2.items li{font-size:15px}
.results .sopts select{max-width:260px;margin-right:14px}
mark.um{background:transparent;border-bottom:3px solid;padding:0 1px;cursor:pointer;color:inherit}
.um1{--mc:#E3B505}.um2{--mc:#3F9E6A}.um3{--mc:#3A7BD5}.um4{--mc:#C8453B}
mark.um{border-color:var(--mc)}
mark.um.um1{background:rgba(227,181,5,.2)}mark.um.um2{background:rgba(63,158,106,.18)}mark.um.um3{background:rgba(58,123,213,.16)}mark.um.um4{background:rgba(200,69,59,.15)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--mc);border:2px solid transparent;vertical-align:-2px;padding:0}
.dot.on{border-color:var(--ink)}
#seltool{display:none;position:fixed;z-index:60;gap:4px;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:4px 6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#seltool button{border:0;background:none;cursor:pointer;font-size:14px;color:var(--ink);padding:2px 5px}
#seltool button.dot{width:16px;height:16px;padding:0;margin:0 2px;border-radius:50%;background:var(--mc)}
#markcard,#setmenu{display:none;position:fixed;z-index:61;background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--cloth);border-radius:3px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.22);width:300px}
#markcard textarea{width:100%;box-sizing:border-box;min-height:70px;margin:6px 0;background:var(--paper-2);color:var(--ink);border:1px solid var(--rule);font:14px var(--sans)}
#markcard .mc-colors{display:flex;gap:6px;align-items:center}
#markcard .mc-colors .n{margin-left:auto;font-size:12px;color:var(--ink-2)}
#markcard button.x,.marklist button.x,.glist2 button.x{border:0;background:none;cursor:pointer;color:var(--ink-2);font-size:16px}
#markcard .mc-acts{display:flex;justify-content:space-between;font-size:13px}
#markcard .mc-acts button{border:1px solid var(--rule);background:var(--paper-2);border-radius:3px;cursor:pointer;font-size:12px;color:var(--ink)}
#setmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 6px;cursor:pointer;color:var(--ink);font-size:14px}
#setmenu button:hover{background:var(--paper-2)}
#setmenu .newset{display:flex;gap:4px;border-top:1px solid var(--rule);margin-top:4px;padding-top:6px}
#setmenu .newset input{flex:1;min-width:0}
#setmenu .newset button{width:auto;border:1px solid var(--rule);border-radius:3px}
#flash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cloth);color:#fff;padding:7px 14px;border-radius:4px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:70;font-size:14px}
#flash.on{opacity:1}
.worktabs{display:flex;gap:4px;align-items:center;margin-bottom:14px;border-bottom:1px solid var(--rule)}
.worktabs a{padding:6px 12px;border:1px solid transparent;border-bottom:0;border-radius:3px 3px 0 0}
.worktabs a.on{border-color:var(--rule);background:var(--paper);color:var(--ink)}
.worktabs .sp,.tools .sp{flex:1}
.worktabs label.btn,.worktabs .btn{margin:0 0 4px 4px}
.marklist{list-style:none;padding:0;margin:0}
.marklist li{display:grid;grid-template-columns:20px 1fr 24px 20px;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule)}
.marklist .q{font-family:var(--serif);font-size:15px;margin-top:3px}
.marklist .cm{font-size:13px;color:var(--ink-2);margin-top:3px;white-space:pre-wrap}
.tools a.on{font-weight:600}
.tools a.dotlink{margin-left:12px}
.notes{display:grid;grid-template-columns:260px 1fr;gap:20px}
.notes .nlist ul{list-style:none;padding:0;margin:8px 0 0}
.notes .nlist li{padding:5px 6px;border-radius:3px;display:flex;flex-direction:column}
.notes .nlist li.on{background:var(--paper-2)}
.notes .nlist li .n{font-size:11px;color:var(--ink-2)}
.notes textarea{width:100%;box-sizing:border-box;min-height:60vh;font:16px/1.55 var(--serif);background:var(--paper);color:var(--ink);border:1px solid var(--rule);padding:12px}
mark.cf{color:inherit;padding:0 1px;border-radius:2px}
.cf1{--cf:rgba(227,181,5,.45)}.cf2{--cf:rgba(63,158,106,.4)}.cf3{--cf:rgba(58,123,213,.38)}.cf4{--cf:rgba(200,69,59,.35)}
mark.cf{background:var(--cf)}
#cfpanel{font-family:var(--sans);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:10px 0 16px;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);font-size:13px}
#cfpanel .cfhead{width:100%;font-weight:600;color:var(--ink-2)}
#cfpanel label.cf{display:flex;gap:5px;align-items:center}
#cfpanel .sw{width:14px;height:14px;border-radius:3px;background:var(--cf)}
#cfpanel input{width:170px;padding:3px 5px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink)}
#cfpanel .btn{margin:0}
.theme-form textarea{width:100%;box-sizing:border-box;font:15px var(--sans);padding:8px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink)}
.plist.theme th{font-size:12px;font-weight:600;color:var(--ink-2);text-align:right;padding:4px 6px}
.plist.theme td.bar{white-space:nowrap}
.plist.theme td.bar .b{display:inline-block;width:140px;height:9px;background:var(--paper-2);border-radius:2px;vertical-align:middle}
.plist.theme td.bar .b span{display:block;height:9px;background:var(--cloth);border-radius:2px;opacity:.75}
.plist.theme td.bar em{display:inline-block;width:44px;text-align:right;font-size:11px;font-style:normal;color:var(--ink-2)}
body.justify .text p{text-align:justify}
body.textonly #index,body.textonly .rail{display:none}
body.textonly .page{grid-template-columns:minmax(0,1fr)}
.idxlinks{padding:0 12px 6px;font-size:12.5px}
#viewmenu{display:none;position:fixed;z-index:62;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:10px;box-shadow:0 6px 18px rgba(0,0,0,.22);width:260px;font-size:13px}
#viewmenu label{display:block;margin-bottom:6px}
#viewmenu .vf{margin:6px 0}
#viewmenu .vf button,#viewmenu #vprint{border:1px solid var(--rule);background:var(--paper-2);border-radius:3px;padding:2px 7px;margin:2px;cursor:pointer;color:var(--ink)}
#viewmenu .vf button.on{border-color:var(--cloth);box-shadow:inset 0 0 0 1px var(--cloth)}
.text abbr{text-decoration:underline dotted;text-underline-offset:2px;cursor:help}
.plist.abbr td.ab{font-weight:600;white-space:nowrap;padding-right:14px;vertical-align:top}
.plist.abbr.sym td.ab{font-size:18px;font-weight:normal;text-align:center}
.plist.abbr.sym .symsvg svg{height:1.15em;width:auto;vertical-align:-.2em}
.plist.abbr.sym .symchar{display:block;font-size:12px;color:var(--ink-2)}
.results h2.sym-h{margin-top:36px}
.letters{margin:8px 0 12px;font-size:15px}
.letters a{margin-right:4px}
.plist.contents td.bar{white-space:nowrap}
.plist.contents td.bar .b{display:inline-block;width:120px;height:8px;background:var(--paper-2);border-radius:2px;vertical-align:middle}
.plist.contents td.bar .b span{display:block;height:8px;background:var(--cloth);border-radius:2px;opacity:.7}
.plist.contents td.bar em{display:inline-block;width:60px;text-align:right;font-size:11px;font-style:normal;color:var(--ink-2)}
@media print {
  #bar,#index,.rail,.hitnav,#seltool,#markcard,#setmenu,#viewmenu,#cfpanel,#flash,.acts,.pager,#sugg{display:none !important}
  html,body,#main,#view{height:auto !important;overflow:visible !important;background:#fff !important;color:#000 !important}
  .page{display:block;max-width:none;padding:0}
  .text{max-width:none;font-size:11pt}
  mark{background:none !important;color:inherit}
  a{color:inherit;text-decoration:none}
}
.plist.places{width:100%;max-width:none}
.plist.places td.ctx{font-family:var(--serif);font-size:14px;width:55%}
.plist.places tr[data-i]{cursor:pointer}
.plist.places tr[data-i]:hover{background:var(--paper-2)}
.plist.places th.sort{cursor:pointer;user-select:none}
.plist.places th{font-size:12px;text-align:left;color:var(--ink-2);padding:4px 6px}
.results .sopts{margin:-6px 0 10px;font-size:13px}
.results .sopts label{margin-right:14px}
.results .sub.warn{color:#8a5a00}
.plist.wl td.nm a{font-family:var(--serif);font-size:16px}
.results .sub{color:var(--ink-2);margin-bottom:22px}
.hit{padding:14px 0 16px;border-bottom:1px solid var(--rule)}
.hit .t{font-family:var(--serif);font-size:20px}
.hit .m{font-size:12.5px;color:var(--ink-2);margin:2px 0 6px}
.hit .m .c{display:inline-block;margin-right:10px}
.hit .s{font-family:var(--serif);font-size:15.5px;line-height:1.5;margin:4px 0}

/* ---------- interface language (i18n.js) ---------- */

/* ---------- folding: same rules as the server ---------- */
const DROP = new Set('´′`˜¨᾿῾῀΄΅');
const foldCache = new Map();

  let f = foldCache.get(c);
  if (f !== undefined) return f;
  if (DROP.has(c)) f = '';

    const t = toks.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));

/* ---------- lemma index ---------- */

function highlight(root, rx, cs, cls) {

  const nodes = []; let n;
  while ((n = walker.nextNode())) if (n.nodeValue.trim() && !n.parentNode.closest('sup, .katex, .m, .md')) nodes.push(n);
  for (const node of nodes) {

    rx.lastIndex = 0; const found = []; let m;
    while ((m = rx.exec(f))) { if (!m[0].length) { rx.lastIndex++; continue; } found.push([idx[m.index], idx[m.index + m[0].length - 1] + 1]); }
    if (!found.length) continue;
    const frag = document.createDocumentFragment(); let pos = 0;
    for (const [s, e] of found) {

      frag.appendChild(document.createTextNode(text.slice(pos, s)));
      const mk = document.createElement('mark'); mk.textContent = text.slice(s, e); if (cls) mk.className = cls; frag.appendChild(mk);
      pos = e;
    }
    frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  }
}

/* ---------- where a person or a concept stands in an article ---------- */
// The same walk serves the snippets on a person's page and the marks in the article, so the n-th
// snippet and the n-th mark are the same place.
const patCache = new Map(), htmlCache = new Map();

    patCache.set(spec, await api('/api/pattern?' + q));

  return htmlCache.get(id);
}

}

/* ---------- columns of the printed edition ---------- */
// ⟦517⟧ in the source becomes <span class="col" data-col="517">: the running text and the notes each
// mark where they continue on a new column; before the first mark of a flow it is the first column
let curArticle = null;

  const inNotes = !!(el && el.closest('ol.notes'));

// The article laid out in the columns of the printed edition. A mark ⟦N⟧ stands where a screen page of
// the digital edition begins in column N, and a column spans two or three such pages: a border found

// The running text (with the literature) and the notes are laid out one after the other, each as its

    g.className = 'bookcols ' + (notes ? 'notes-flow' : 'text-flow');
    const filled = n => (cols.get(n) || []).length > 0;
    // one printed page per row, the odd column on the left; a page with nothing of this flow is left
    // out (the notes of a part stand where that part ends), an empty half of a page stays blank
    for (let n = lo - (lo % 2 ? 0 : 1); n <= hi; n += 2) {
      if (!filled(n) && !filled(n + 1)) continue;
      for (const k of [n, n + 1]) {
        if (!filled(k)) { const blank = document.createElement('div'); blank.className = 'bcol' + (k % 2 ? ' l' : ''); g.append(blank); continue; }
        const sec = document.createElement('section');
        sec.className = 'bcol' + (k % 2 ? ' l' : ''); sec.dataset.col = k;
        const h = document.createElement('div'); h.className = 'bc-h'; h.dataset.col = k; h.title = tip;
        const box = document.createElement(notes ? 'ol' : 'div');
        if (notes) box.className = 'notes';
        cols.get(k).forEach(x => box.append(x));
        sec.append(h, box);
        g.append(sec);
      }
    }
    return g;
  };
  // a table, a displayed formula or a picture wider than its column: the page it stands on is laid out
  // one column under the other, each the full width (the pairs of the other pages stay as they are)
  const tooWide = (e, w) => {
    if (e.matches('figure.pic')) {
      const svg = e.querySelector('svg'), img = e.querySelector('img');
      const natural = svg ? parseFloat(svg.style.maxWidth) || 0 : img ? img.naturalWidth || 0 : 0;
      return natural > w * 1.15;
    }
    return e.scrollWidth > e.clientWidth + 4;
  };
  const widen = g => {
    if (!g) return;
    const cells = [...g.children];
    for (let i = 0; i + 1 < cells.length; i += 2) {
      const page = [cells[i], cells[i + 1]];
      const wide = page.some(c => c.matches('section') && [...c.querySelectorAll('.tbl, .md, figure.pic')].some(e => tooWide(e, c.children[1].clientWidth)));
      if (wide) page.forEach(c => c.classList.add('wide'));
    }
  };
  const kids = [...body.children];
  const notesOl = kids.find(n => n.matches('ol.notes')), notesH = kids.find(n => n.id === 'notes');
  const textGrid = grid(splitFlow(kids.filter(n => n !== notesOl && n !== notesH)), false);
  const noteGrid = notesOl ? grid(splitFlow([...notesOl.children]), true) : null;
  body.textContent = '';
  if (textGrid) body.append(textGrid);
  if (notesH) body.append(notesH);
  if (noteGrid) body.append(noteGrid);
  widen(textGrid); widen(noteGrid);
  // a picture that is still loading has no width yet: look again once it has one
  body.querySelectorAll('.bookcols figure.pic img').forEach(im => { if (!im.complete) im.addEventListener('load', () => { const g = im.closest('.bookcols'); g.querySelectorAll('.wide').forEach(x => x.classList.remove('wide')); widen(g); }, {once: true}); });
}

// the text of an article as one string, with the text node and offset of every character run
function bodyText(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = []; let n, pos = 0, s = '';
  while ((n = walker.nextNode())) {
    if (n.parentNode.closest('.katex-mathml')) continue;
    nodes.push([n, pos]); s += n.nodeValue; pos += n.nodeValue.length;
  }
  return {text: s, nodes};
}
function textIndex(bt, node, offset) {
  // (container, offset) of a Range -> index in bt.text
  if (node.nodeType === 3) { const e = bt.nodes.find(x => x[0] === node); if (e) return e[1] + offset; }
  const r = document.createRange(); r.setStart(node, offset); r.collapse(true);
  for (const [tn, p] of bt.nodes) if (r.comparePoint(tn, 0) >= 0) return p;
  return bt.text.length;
}
function wrapRange(bt, s, e, make) {
  // wrap the characters [s, e) of the text into elements, one per text node they touch
  const out = [];
  for (let i = bt.nodes.length - 1; i >= 0; i--) {
    const [n, p] = bt.nodes[i], L = n.nodeValue.length;
    const a = Math.max(s, p), b = Math.min(e, p + L);
    if (a >= b) continue;
    const tail = n.splitText(b - p); void tail;
    const mid = n.splitText(a - p);
    const el = make(); mid.parentNode.replaceChild(el, mid); el.appendChild(mid); out.unshift(el);
  }
  return out;
}
function paintMarks(aid) {
  const body = $('#body'); if (!body) return;
  const mine = WORK.marks.filter(m => m.aid === aid);
  for (const m of mine) {
    const bt = bodyText(body);
    // the quote where its context fits best (the article may have been rebuilt meanwhile)
    let best = -1, bestScore = -1, i = bt.text.indexOf(m.quote);
    while (i >= 0) {
      let sc = 0;
      const pre = bt.text.slice(Math.max(0, i - m.prefix.length), i), suf = bt.text.slice(i + m.quote.length, i + m.quote.length + m.suffix.length);
      while (sc < pre.length && pre[pre.length - 1 - sc] === m.prefix[m.prefix.length - 1 - sc]) sc++;
      let k = 0; while (k < suf.length && suf[k] === m.suffix[k]) k++;
      if (sc + k > bestScore) { bestScore = sc + k; best = i; }
      i = bt.text.indexOf(m.quote, i + 1);
    }
    if (best < 0) continue;
    wrapRange(bt, best, best + m.quote.length, () => {
      const el = document.createElement('mark'); el.className = 'um um' + m.color; el.dataset.mid = m.id;
      if (m.comment) el.title = m.comment;
      return el;
    });
  }
}
function selectionInBody() {
  const sel = getSelection(), body = $('#body');

}
function citeOf(a, c1, c2) { return `HWPh, Bd. ${a.band}, Sp. ${c1}${c2 > c1 ? '–' + c2 : ''}, Art. ‹${a.lemma}›`; }
function addMark(color) {
  const r = selectionInBody(), a = curArticle; if (!r || !a) return;
  const bt = bodyText($('#body'));
  let s = textIndex(bt, r.startContainer, r.startOffset), e = textIndex(bt, r.endContainer, r.endOffset);
  while (s < e && /\s/.test(bt.text[s])) s++;
  while (e > s && /\s/.test(bt.text[e - 1])) e--;
  if (e <= s) return;
  const c1 = colAtPoint(r.startContainer, r.startOffset, $('#body'), a.col_from);
  const c2 = Math.max(c1, colAtPoint(r.endContainer, r.endOffset, $('#body'), a.col_from));
  const m = {id: newId(), aid: a.id, lemma: a.lemma, band: a.band, col: c1, col2: c2, color,
             quote: bt.text.slice(s, e), prefix: bt.text.slice(Math.max(0, s - 40), s), suffix: bt.text.slice(e, e + 40),
             comment: '', created: new Date().toISOString().slice(0, 16).replace('T', ' ')};
  WORK.marks.push(m); saveWork();
  getSelection().removeAllRanges(); hideSelTool();
  wrapRange(bt, s, e, () => { const el = document.createElement('mark'); el.className = 'um um' + color; el.dataset.mid = m.id; return el; });

}

// "+ to a selection": one article or everything a search found
function setMenu(anchor, addIds) {
  let menu = $('#setmenu');
  if (!menu) { menu = document.createElement('div'); menu.id = 'setmenu'; document.body.appendChild(menu); }
  menu.innerHTML = WORK.sets.map(s => `<button data-s="${s.id}">${esc(s.name)} <span class="n">${s.aids.length}</span></button>`).join('') +
    `<div class="newset"><input placeholder="${t('work.set_name_ph')}"><button data-new="1">${t('work.set_new')}</button></div>`;
  const r = anchor.getBoundingClientRect();
  menu.style.display = 'block'; menu.style.left = Math.min(window.innerWidth - 260, r.left) + 'px'; menu.style.top = (r.bottom + 4) + 'px';
  const done = async s => {
    const ids = await addIds();
    const before = s.aids.length;
    s.aids = [...new Set(s.aids.concat(ids))]; saveWork();
    menu.style.display = 'none';
    flash(t('work.set_added', {n: s.aids.length - before, name: s.name}));
  };
  menu.querySelectorAll('[data-s]').forEach(b => b.onclick = () => done(setById(b.dataset.s)));

  };
  setTimeout(() => document.addEventListener('mousedown', function off(e) { if (!menu.contains(e.target)) { menu.style.display = 'none'; document.removeEventListener('mousedown', off); } }), 0);
}

// in notes and bibliographies the sigla and periodicals of the list get their expansion on hover
async function hintAbbrevs(root) {
  let d; try { d = await abbrevs(); } catch (e) { return; }
  const items = [].concat(...d.abbreviations.slice(0, 2).map(s => s.items)).filter(it => it.a.length >= 2);
  if (!items.length) return;
  if (!hintAbbrevs.rx) {
    hintAbbrevs.map = new Map(items.map(it => [it.a.replace(/\d+$/, ''), it.text]));
    const alts = [...hintAbbrevs.map.keys()].sort((a, b) => b.length - a.length).map(a => a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+'));
    hintAbbrevs.rx = new RegExp('(?<![\\p{L}\\p{N}])(?:' + alts.join('|') + ')(?![\\p{L}])', 'gu');
  }
  const blocks = [...root.querySelectorAll('ol.notes li, .lit')];
  for (const b of blocks) {
    const walker = document.createTreeWalker(b, NodeFilter.SHOW_TEXT), nodes = []; let n;
    while ((n = walker.nextNode())) if (!n.parentNode.closest('abbr, mark, sup, .katex')) nodes.push(n);
    for (const node of nodes) {
      const rx = hintAbbrevs.rx; rx.lastIndex = 0; const text = node.nodeValue; let m, pos = 0; const frag = document.createDocumentFragment(); let any = false;
      while ((m = rx.exec(text))) {
        const full = hintAbbrevs.map.get(m[0].replace(/\s+/g, ' '));
        if (!full) continue;
        any = true;
        frag.appendChild(document.createTextNode(text.slice(pos, m.index)));
        const ab = document.createElement('abbr'); ab.title = full; ab.textContent = m[0]; frag.appendChild(ab);
        pos = m.index + m[0].length;
      }
      if (!any) continue;
      frag.appendChild(document.createTextNode(text.slice(pos)));
      node.parentNode.replaceChild(frag, node);
    }
  }
}

/* ---------- the list of places (Fundstellenliste) ---------- */
// Every place a query finds, across articles; ↑↓ in an article opened from it go on to the next place,
// also in the next article. The list can be sorted, thinned out and copied.
let PLACES = null;              // {key, q, opts, rows}
function copyText(text) {
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); };
  try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).catch(fallback); } else fallback(); } catch (e) { fallback(); }
  flash(t('list.copied', {n: text.split('\n').length}));
}
const plainOf = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
function placeLine(r) { return `${r.lemma} — HWPh, Bd. ${r.band}, Sp. ${r.col} (${t('where.' + r.where)}): ${plainOf(r.html)}`; }
async function showPlaces(params) {
  const q = params.get('q') || '', scope = params.get('scope') || 'all', band = params.get('band') || '';
  const o = {tol: params.get('tol') === '1', cs: params.get('case') === '1'};
  const limit = params.get('limit') || '500';
  curId = null; markCurrent();
  document.title = t('places.title') + ': ' + q + ' — HWPh';
  const inSet = params.get('set') ? setById(params.get('set')) : null;
  const qs = new URLSearchParams({q, scope, band, limit});
  if (params.get('grp')) qs.set('grp', params.get('grp'));
  if (inSet) qs.set('only', inSet.aids.join(',') || '0');
  const key = location.hash;
  let rows;
  if (PLACES && PLACES.key === key) rows = PLACES.rows;
  else {
    const r = await api('/api/places?' + qs.toString() + optsQuery(o));
    rows = r.places.map((x, i) => Object.assign({n: i + 1}, x));
    PLACES = {key, q, o, rows, articles: r.articles, more: r.more};
  }
  const P = PLACES;
  let sortKey = 'n', sortDir = 1;
  const listHash = key;
  const draw = () => {
    const rs = P.rows.slice().sort((a, b) => {
      const v = sortKey === 'lemma' ? (a.lemma < b.lemma ? -1 : a.lemma > b.lemma ? 1 : 0)
        : sortKey === 'loc' ? (a.band - b.band || a.col - b.col) : sortKey === 'where' ? (a.where < b.where ? -1 : a.where > b.where ? 1 : 0) : a.n - b.n;
      return (v || a.n - b.n) * sortDir;

const pop = $('#pop'); let popFor = null;

function submitSearch() {

/* ---------- as-you-type suggestions ---------- */
const sugg = $('#sugg');
let suggItems = [], suggOn = -1, suggSeq = 0, suggT;
const suggKind = k => t('sugg.' + k);
function suggHide() { sugg.style.display = 'none'; suggItems = []; suggOn = -1; qInput.setAttribute('aria-expanded', 'false'); }
function suggGo(it) {
  suggHide();
  if (!it || it.type === 'full') return submitSearch();
  if (it.type === 'article') location.hash = '#/a/' + it.id;
  else if (it.type === 'person') location.hash = '#/p/' + it.id;
  else if (it.type === 'register') location.hash = '#/a/' + it.id + '?q=' + encodeURIComponent(it.term);
}
function suggSub(it) {
  if (it.type === 'full') return it.sub;
  if (it.type === 'article') return 'Bd. ' + it.band + ', Sp. ' + it.col;
  if (it.type === 'person') return t('n.articles', {n: it.n});
  if (it.type === 'register') return '→ ' + it.lemma + (it.more ? t('sugg.reg_more', {n: it.more}) : '');
  return '';
}
function suggRender() {
  sugg.innerHTML = suggItems.map((it, i) => `<div class="it${it.type === 'full' ? ' full' : ''}${i === suggOn ? ' on' : ''}" data-i="${i}" role="option">
    <span class="k">${it.type === 'full' ? t('sugg.full') : it.type === 'person' && it.role ? t('sugg.role_' + it.role) : suggKind(it.type)}</span>
    <span class="l">${esc(it.label)}</span><span class="s">${esc(suggSub(it))}</span></div>`).join('');
  sugg.style.display = suggItems.length ? 'block' : 'none';
  qInput.setAttribute('aria-expanded', suggItems.length ? 'true' : 'false');
}
async function suggLoad() {
  const q = qInput.value.trim(), seq = ++suggSeq;
  if (fold(q).length < 2 || scopeSel.value === 'register') { suggHide(); return; }
  let r;
  try { r = await api('/api/suggest?q=' + encodeURIComponent(q)); } catch (e) { return; }
  if (seq !== suggSeq || document.activeElement !== qInput) return;       // a later keystroke won
  suggItems = [{type: 'full', label: t('sugg.search', {q}), sub: 'Enter'}].concat(r.items);
  suggOn = -1; suggRender();
}
qInput.addEventListener('input', () => { clearTimeout(suggT); suggT = setTimeout(suggLoad, 120); });
qInput.addEventListener('keydown', e => {
  const open = sugg.style.display === 'block' && suggItems.length;
  if (e.key === 'ArrowDown' && open) { e.preventDefault(); suggOn = (suggOn + 1) % suggItems.length; suggRender(); }
  else if (e.key === 'ArrowUp' && open) { e.preventDefault(); suggOn = suggOn <= 0 ? suggItems.length - 1 : suggOn - 1; suggRender(); }
  else if (e.key === 'Escape') { suggHide(); }
  else if (e.key === 'Enter') { e.preventDefault(); const it = open && suggOn >= 0 ? suggItems[suggOn] : null; suggHide(); if (it) suggGo(it); else submitSearch(); }
});
sugg.addEventListener('mousedown', e => { const el = e.target.closest('.it'); if (el) { e.preventDefault(); suggGo(suggItems[+el.dataset.i]); } });
qInput.addEventListener('blur', () => setTimeout(suggHide, 150));
scopeSel.onchange = bandSel.onchange = () => { if (qInput.value.trim()) submitSearch(); };
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); qInput.focus(); qInput.select(); }

function drawGraph(svg, g, opts) {
  const NS = 'http://www.w3.org/2000/svg';
  const W = svg.clientWidth || 900, H = svg.clientHeight || 600;
  const N = g.nodes.slice(), byId = new Map(N.map(n => [n.id, n]));
  let L = [];
  const lkey = l => l.source + '>' + l.target + ':' + l.kind;
  const lkeys = new Set();
  const addLinks = ls => ls.forEach(l => { if (byId.has(l.source) && byId.has(l.target) && !lkeys.has(lkey(l))) { lkeys.add(lkey(l)); L.push(l); } });
  addLinks(g.links);

  const sizeNodes = () => {
    const deg = new Map();
    L.forEach(l => { deg.set(l.source, (deg.get(l.source) || 0) + 1); deg.set(l.target, (deg.get(l.target) || 0) + 1); });
    N.forEach(n => {
      const base = Math.min(9, 4 + Math.sqrt(deg.get(n.id) || 1) * 1.3);
      n.r = n.id === g.center ? 11 : n.role === 'scholar' ? 3.5 : n.role === 'mixed' ? Math.max(4, base * 0.8) : base;
    });
  };
  // initial rings by level, deterministic angles
  const perLevel = {};
  N.forEach(n => { (perLevel[n.level] = perLevel[n.level] || []).push(n); });
  Object.keys(perLevel).forEach(lv => perLevel[lv].forEach((n, i, arr) => {
    const r = lv * 170, a = (i / arr.length) * Math.PI * 2 + lv * 0.3;
    n.x = r * Math.cos(a); n.y = r * Math.sin(a); n.vx = 0; n.vy = 0;
  }));

  // force layout; `moving` limits who may move (incremental growth keeps the old picture in place)
  const layout = (iters, moving, strength) => {
    const maxW = Math.max(1, ...L.map(l => l.w || 1));
    const REP = N.length > 40 ? 7000 : 4200;
    for (let it = 0; it < iters; it++) {
      const alpha = (1 - it / iters) * (strength || 1);
      for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
        const a = N[i], b = N[j]; let dx = a.x - b.x, dy = a.y - b.y; const d2 = dx * dx + dy * dy + 0.01;
        const f = REP / d2 * alpha; const d = Math.sqrt(d2);
        dx /= d; dy /= d; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
      }
      for (const l of L) {
        const a = byId.get(l.source), b = byId.get(l.target);
        const want = l.kind === 'cocite' ? 190 - 80 * ((l.w || 1) / maxW) : (l.kind === 'cite' ? 170 : l.kind === 'mention' ? 150 : 120);
        let dx = b.x - a.x, dy = b.y - a.y; const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const f = (d - want) * (l.kind === 'cite' ? 0.006 : 0.02) * alpha; dx /= d; dy /= d;
        a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
      }
      for (const n of N) {
        n.vx -= n.x * 0.0025 * alpha; n.vy -= n.y * 0.0025 * alpha;
        if (n.id === g.center || (moving && !moving.has(n.id))) { n.vx = n.vy = 0; continue; }
        n.x += Math.max(-30, Math.min(30, n.vx)); n.y += Math.max(-30, Math.min(30, n.vy)); n.vx *= 0.55; n.vy *= 0.55;
      }
    }
  };
  sizeNodes();
  layout(360);

  // fit to view
  let vb;
  const fit = () => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    N.forEach(n => { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); });
    const pad = 80; vb = [x0 - pad, y0 - pad, (x1 - x0) + 2 * pad + 120, (y1 - y0) + 2 * pad];
    const aspect = W / H;
    if (vb[2] / vb[3] < aspect) { const w = vb[3] * aspect; vb[0] -= (w - vb[2]) / 2; vb[2] = w; }
    else { const h = vb[2] / aspect; vb[1] -= (h - vb[3]) / 2; vb[3] = h; }
  };
  // labels keep their on-screen size whatever the zoom
  const setVB = () => { svg.setAttribute('viewBox', vb.map(v => v.toFixed(1)).join(' '));
    svg.style.setProperty('--gk', Math.max(0.35, vb[2] / (svg.clientWidth || W)).toFixed(3)); };
  fit(); setVB();

  let lineEls = [], adj = new Map(), selected = null;
  const place = () => L.forEach((l, i) => {
    const a = byId.get(l.source), b = byId.get(l.target), e = lineEls[i];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    e.setAttribute('x1', a.x); e.setAttribute('y1', a.y);
    e.setAttribute('x2', b.x - dx / d * (b.r + 2)); e.setAttribute('y2', b.y - dy / d * (b.r + 2));
  });
  const render = () => {
    const maxW = Math.max(1, ...L.map(l => l.w || 1));
    svg.innerHTML = `<defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--ink-2)" fill-opacity=".6"/></marker></defs>`;
    const gl = document.createElementNS(NS, 'g'), gn = document.createElementNS(NS, 'g');
    svg.appendChild(gl); svg.appendChild(gn);
    lineEls = L.map(l => {
      const e = document.createElementNS(NS, 'line');
      e.setAttribute('class', 'ln ' + (l.kind || ''));
      if (l.kind === 'xref') e.setAttribute('marker-end', 'url(#arr)');
      if (l.kind === 'cocite') e.setAttribute('stroke-width', (0.8 + 4 * (l.w || 1) / maxW).toFixed(2));
      gl.appendChild(e); return e;
    });
    N.forEach(n => {
      const e = document.createElementNS(NS, 'g');
      e.setAttribute('class', `nd ${n.kind} l${n.level}${n.role ? ' role-' + n.role : ''}${n.id === g.center ? ' center' : ''}`);
      const diamond = n.kind === 'person' && n.role !== 'scholar';
      const shape = document.createElementNS(NS, diamond ? 'rect' : 'circle');
      if (diamond) { shape.setAttribute('width', n.r * 2); shape.setAttribute('height', n.r * 2); shape.setAttribute('x', -n.r); shape.setAttribute('y', -n.r); shape.setAttribute('transform', 'rotate(45)'); }
      else shape.setAttribute('r', n.r);
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', n.r + 4); t.setAttribute('y', 4); t.textContent = n.label;
      const tt = document.createElementNS(NS, 'title');
      tt.textContent = n.label + (n.sub ? ' — ' + subText(n) : '') + (n.role ? ' (' + roleText(n.role) + ')' : '');
      e.appendChild(shape); e.appendChild(t); e.appendChild(tt);
      e.setAttribute('transform', `translate(${n.x},${n.y})`);
      e.dataset.id = n.id;
      gn.appendChild(e); n.el = e;
    });
    place();
    adj = new Map(N.map(n => [n.id, new Set()]));
    L.forEach((l, i) => { adj.get(l.source).add(i); adj.get(l.target).add(i); });
    $('#gcount').textContent = t('graph.count', {n: N.length, m: L.length});
    if (selected) hot(byId.has(selected.id) ? selected.id : null);
  };
  const hot = id => {
    N.forEach(n => n.el.classList.remove('hot', 'dim')); lineEls.forEach(e => e.classList.remove('hot'));
    if (!id) return;
    const keep = new Set([id]);
    adj.get(id).forEach(i => { lineEls[i].classList.add('hot'); keep.add(L[i].source); keep.add(L[i].target); });
    N.forEach(n => n.el.classList.add(keep.has(n.id) ? 'hot' : 'dim'));
  };

  // ---- the node card: what hangs on the node, each line can be put on the graph or taken off
  const addedBy = new Map();                 // node id -> id of the node from whose card it was added
  const cache = new Map();                   // "node:what" -> list from /api/expand
  const cardScroll = {};
  const inView = () => {
    // widen the view when new nodes fall outside it (never shrink: the reader may have zoomed in)
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    N.forEach(n => { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); });
    const pad = 60, labelRoom = 120;
    // keep the nodes clear of the open card on the right
    const cardRoom = info.style.display !== 'none' ? (info.offsetWidth + 20) * vb[2] / (svg.clientWidth || W) : 0;
    const nx0 = Math.min(vb[0], x0 - pad), ny0 = Math.min(vb[1], y0 - pad);
    const nx1 = Math.max(vb[0] + vb[2], x1 + pad + labelRoom + cardRoom), ny1 = Math.max(vb[1] + vb[3], y1 + pad);
    if (nx0 < vb[0] || ny0 < vb[1] || nx1 > vb[0] + vb[2] || ny1 > vb[1] + vb[3]) {
      let w = nx1 - nx0, h = ny1 - ny0; const aspect = W / H;
      if (w / h < aspect) { const w2 = h * aspect; vb = [nx0 - (w2 - w) / 2, ny0, w2, h]; }
      else { const h2 = w / aspect; vb = [nx0, ny0 - (h2 - h) / 2, w, h2]; }
      setVB();
    }
  };
  const addItems = (anchor, items) => {
    const fresh = [];
    items.forEach(it => {
      if (!byId.has(it.node.id)) {
        const x = Object.assign({}, it.node, {vx: 0, vy: 0});
        N.push(x); byId.set(x.id, x); addedBy.set(x.id, anchor.id); fresh.push(x);
      }
      addLinks([it.link]);
    });
    if (!fresh.length) { render(); return 0; }
    // new nodes start on a small ring around the anchor, on the side away from the centre of the picture
    const away = Math.atan2(anchor.y, anchor.x) || 0;
    fresh.forEach((x, i) => {
      const a = away + (i - (fresh.length - 1) / 2) * (Math.PI / Math.max(4, fresh.length));
      const r = 110 + (i % 2) * 30;
      x.x = anchor.x + r * Math.cos(a); x.y = anchor.y + r * Math.sin(a);
    });
    sizeNodes();
    layout(200, new Set(fresh.map(x => x.id)), 0.6);   // only the newcomers move; the picture stays put
    render(); inView();
    return fresh.length;
  };
  const removeIds = ids => {
    // take nodes off together with whatever was hung on them later
    const gone = new Set();
    const walk = id => { if (id === g.center || gone.has(id)) return; gone.add(id);
      addedBy.forEach((from, x) => { if (from === id) walk(x); }); };
    ids.forEach(walk);
    if (!gone.size) return;
    for (let i = N.length - 1; i >= 0; i--) if (gone.has(N[i].id)) { byId.delete(N[i].id); N.splice(i, 1); }
    gone.forEach(id => addedBy.delete(id));
    L = L.filter(l => byId.has(l.source) && byId.has(l.target));
    lkeys.clear(); L.forEach(l => lkeys.add(lkey(l)));
    sizeNodes(); render();
  };
  const loadList = async (n, what) => {
    const key = n.id + ':' + what + ':' + (opts.scholars ? 1 : 0);
    if (!cache.has(key)) cache.set(key, await api(`/api/expand?node=${n.id}&what=${what}&limit=80&scholars=${opts.scholars ? 1 : 0}`));
    return cache.get(key);
  };
  const SECTIONS = {persons: t('card.sec_persons'), concepts: t('card.sec_concepts'), articles: t('card.sec_articles')};
  const HOW = {xref: '→', xref_in: '←', mention: '≈'};
  const info = $('#ginfo');
  const open = n => n.kind === 'article' ? '#/a/' + n.ref : '#/p/' + n.ref;
  const regraph = n => n.kind === 'article' ? '#/g/a/' + n.ref : '#/g/p/' + n.ref;
  const lists = {};                          // what -> loaded list, for the card on screen
  async function fillCard(n) {
    const whats = n.kind === 'article' ? ['persons', 'concepts'] : ['articles'];
    for (const w of whats) {
      if (selected !== n) return;
      try { lists[w] = await loadList(n, w); } catch (e) { lists[w] = {items: [], total: 0}; }
      drawCard(n);
    }
  }
  function drawCard(n) {
    const box = info.querySelector('.gsec-wrap');
    if (box) cardScroll[n.id] = box.scrollTop;
    const whats = n.kind === 'article' ? ['persons', 'concepts'] : ['articles'];
    const sec = w => {
      const d = lists[w];
      if (!d) return `<div class="gsec"><h5>${SECTIONS[w]}</h5><div class="gnote">${t('card.loading')}</div></div>`;
      if (!d.items.length) return `<div class="gsec"><h5>${SECTIONS[w]}</h5><div class="gnote">${t('card.none')}${w === 'persons' && !opts.scholars ? t('card.scholars_hidden') : ''}</div></div>`;
      const on = d.items.filter(it => byId.has(it.node.id)).length;
      const rows = d.items.map((it, i) => {
        const here = byId.has(it.node.id);
        const role = it.node.role && it.node.role !== 'source' ? ` <span class="gr">${it.node.role === 'scholar' ? t('card.scholar_short') : t('card.mixed_short')}</span>` : '';
        return `<li class="${here ? 'on' : ''}" data-w="${w}" data-i="${i}" title="${here ? t('card.remove') : t('card.add')}">
          <span class="mk">${here ? '●' : '○'}</span>${it.how ? `<span class="hw" title="${esc(noteText(it))}">${HOW[it.how]}</span>` : ''}
          <span class="nm">${esc(it.node.label)}${role}</span><span class="sb">${esc(noteText(it) || subText(it.node))}</span>
          <a class="go" href="${open(it.node)}" title="${t('card.open')}">↗</a></li>`;
      }).join('');
      return `<div class="gsec"><h5>${SECTIONS[w]} <span class="n">${t('card.count', {on, total: d.total})}${d.total > d.items.length ? t('card.shown', {n: d.items.length}) : ''}</span></h5>
        <div class="gbtn"><button data-add="${w}">${t('card.first10')}</button><button data-clear="${w}" ${on ? '' : 'disabled'}>${t('card.clear')}</button></div>
        <ul class="glist">${rows}</ul></div>`;
    };
    info.innerHTML = `<b>${esc(n.label)}</b>${esc(subText(n))}${n.role ? `<div class="grole">${roleText(n.role)}</div>` : ''}
      <div class="glinks"><a href="${open(n)}">${n.kind === 'article' ? t('card.open_article') : t('card.person_page')}</a><a href="${regraph(n)}">${t('card.graph_here')}</a>
      ${n.id !== g.center ? '<button data-x="1" title="' + t('card.remove_node_title') + '">' + t('card.remove_node') + '</button>' : ''}</div>
      <div class="gsec-wrap">${whats.map(sec).join('')}</div>`;
    const wrap = info.querySelector('.gsec-wrap');
    if (cardScroll[n.id]) wrap.scrollTop = cardScroll[n.id];
    info.querySelectorAll('.glist li').forEach(li => li.addEventListener('click', ev => {
      if (ev.target.closest('.go')) return;
      const it = lists[li.dataset.w].items[+li.dataset.i];
      if (byId.has(it.node.id)) removeIds([it.node.id]); else addItems(n, [it]);
      select(n, true);
    }));
    info.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
      const d = lists[b.dataset.add];
      const next = d.items.filter(it => !byId.has(it.node.id)).slice(0, 10);
      addItems(n, next); select(n, true);
    });
    info.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => {
      removeIds(lists[b.dataset.clear].items.map(it => it.node.id).filter(id => byId.has(id)));
      select(n, true);
    });
    const x = info.querySelector('[data-x]'); if (x) x.onclick = () => { removeIds([n.id]); select(null); };
  }
  function select(n, keepLists) {
    selected = n && byId.has(n.id) ? n : null; hot(selected ? selected.id : null);
    if (!selected) { info.style.display = 'none'; return; }
    info.style.display = 'flex';
    if (!keepLists) { Object.keys(lists).forEach(k => delete lists[k]); drawCard(selected); fillCard(selected); }
    else drawCard(selected);
  }

  render();
  // interaction: hover, click, drag nodes, pan, zoom (delegated: the drawing is rebuilt when the graph grows)
  const pt = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  const nodeOf = el => { const e = el.closest && el.closest('.nd'); return e ? byId.get(e.dataset.id) : null; };
  let dragN = null, pan = null, moved = false;
  svg.addEventListener('pointerover', ev => { const n = nodeOf(ev.target); if (n && !selected) hot(n.id); });
  svg.addEventListener('pointerout', ev => { if (!selected && nodeOf(ev.target)) hot(null); });
  svg.addEventListener('pointerdown', ev => {
    const n = nodeOf(ev.target); moved = false;
    if (n) dragN = n; else { pan = {x: ev.clientX, y: ev.clientY, vb: vb.slice()}; svg.classList.add('drag'); }
    svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener('pointermove', ev => {
    if (dragN) { const p = pt(ev); dragN.x = p.x; dragN.y = p.y; dragN.el.setAttribute('transform', `translate(${p.x},${p.y})`); place(); moved = true; }
    else if (pan) { const k = vb[2] / svg.clientWidth; vb[0] = pan.vb[0] - (ev.clientX - pan.x) * k; vb[1] = pan.vb[1] - (ev.clientY - pan.y) * k; setVB(); moved = true; }
  });
  svg.addEventListener('pointerup', () => {
    if (dragN && !moved) select(dragN);
    else if (pan && !moved) select(null);
    dragN = null; pan = null; svg.classList.remove('drag');
  });
  svg.addEventListener('dblclick', ev => { const n = nodeOf(ev.target); if (n) location.hash = regraph(n); });
  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const p = pt(ev), k = ev.deltaY > 0 ? 1.15 : 1 / 1.15;
    vb = [p.x - (p.x - vb[0]) * k, p.y - (p.y - vb[1]) * k, vb[2] * k, vb[3] * k]; setVB();
  }, {passive: false});
}

/* keep the local server alive while the page is open (it may be started to quit when idle) */
if (!window.HWPH_API) setInterval(() => { fetch('/api/ping').catch(() => {}); }, 60000);

/* ---------- language switch ---------- */
const langSel = $('#lang');
langSel.innerHTML = LANGS.map(l => `<option value="${l}">${l.toUpperCase()}</option>`).join('');
function setLang(l) {
  LANG = l; store.set('lang', l);
  document.documentElement.lang = l;
  langSel.value = l;
  applyStatic();
  // the parts drawn from data: counts, volume names, the page on screen
  if (LEMMAS.length) {
    renderList($('#filter').value);
    [...bandSel.options].slice(1).forEach(o => { o.textContent = t('band.n', {b: o.value}); });
    route();
  }
}
langSel.onchange = () => setLang(langSel.value);
document.documentElement.lang = LANG;
langSel.value = LANG;
applyStatic();

/* ---------- start ---------- */
// the static export marks its index.html; if the page is that export but its own script files did not
// load (a phone's file manager hands the browser a content:// address, some browsers refuse file://),
// say so plainly instead of trying a server that is not there
function staticFilesMissing() {
  if (!window.HWPH_STATIC || window.HWPH_API) return false;
  const where = esc(location.protocol + '//' + location.host + location.pathname);
  view.innerHTML = window.I18N
    ? `<div class="page wide"><div class="err">${t('err.static_files', {where})}</div></div>`
    : `<div class="page wide"><div class="err">The reader's files next to index.html could not be loaded (${where}). ` +
      `Open the folder through a local web server, e.g. <code>python -m http.server 8000</code> in this folder, then http://127.0.0.1:8000/.<br>` +
      `Die Dateien neben index.html lassen sich nicht laden. Öffnen Sie den Ordner über einen lokalen Webserver, z. B. <code>python -m http.server 8000</code> in diesem Ordner, dann http://127.0.0.1:8000/.</div></div>`;
  return true;
}
(async function init() {
  if (staticFilesMissing()) return;
  try {
    INFO = await api('/api/info');
    const rows = await api('/api/lemmas');
    LEMMAS = rows.map(r => ({id: r[0], lemma: r[1], band: r[2], col: r[3], kind: r[4], colTo: r[5] || r[3], f: fold(r[1])}));
    const bands = [...new Set(rows.filter(r => r[4] === 'article').map(r => r[2]))].sort((a, b) => parseInt(a) - parseInt(b));
    $('#jband').innerHTML = bands.map(b => `<option value="${esc(b)}">Bd. ${esc(b)}</option>`).join('');
    document.body.classList.toggle('bookmode', !!store.get('cols', ''));
    bandSel.insertAdjacentHTML('beforeend', bands.map(b => `<option value="${esc(b)}">${t('band.n', {b: esc(b)})}</option>`).join(''));
    renderList('');
    route();
  } catch (e) {
    view.innerHTML = `<div class="page wide"><div class="err">${t('err.server', {msg: esc(e.message)})}</div></div>`;
  }
})();
</script>
</body>
